<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" stroke-linecap="butt" stroke-linejoin="miter">
  <defs>
    <linearGradient id="planuraTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4050F0"/>
      <stop offset="100%" stop-color="#3039C9"/>
    </linearGradient>
    <linearGradient id="planuraSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D39BD"/>
      <stop offset="100%" stop-color="#2631A8"/>
    </linearGradient>
    <linearGradient id="planuraLightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0D8FA"/>
      <stop offset="100%" stop-color="#9EAFE9"/>
    </linearGradient>
  </defs>

  <!-- selected top plane -->
  <polygon points="78,352 256,263 434,352 256,441" fill="url(#planuraTop)"/>
  <polyline points="78,352 256,263 434,352 256,441 78,352" fill="none" stroke="#293AB4" stroke-width="10"/>

  <!-- screen-facing select cursor, tip on the plane; the two wing tips sit on one
       2:1 isometric line to read level with the plane below, and the barb interior
       angles stay obtuse so the tips read blunt at toolbar sizes
       (owner-refined geometry, Affinity 2026-09-04 - source: refs/tb_select/affinity-edit.svg) -->
  <polygon points="298,322 154,191 206,157 190,107 217,94 247,139 294,121"
           fill="url(#planuraLightFace)" stroke="#293AB4" stroke-width="10"/>
</svg>
